apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My First CloudBees Workflow

# 1. Define when this workflow should run
on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to trigger it manually from the UI

# 2. Define the jobs that will execute
jobs:
  build-and-test:
    # 3. Define the sequential steps for this job
    steps:
      - name: Check out repository code
        uses: https://github.com/cloudbees-io/checkout@v2

      - name: Run a simple echo command
        uses: docker://alpine:3.23
        run: echo "Hello from CloudBees Unify!"

      - name: Check Terraform formatting
        uses: docker://hashicorp/terraform:1.9
        run: terraform fmt -check -recursive

      - name: Validate Terraform modules
        uses: docker://hashicorp/terraform:1.9
        run: |
          for dir in modules/*/; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done